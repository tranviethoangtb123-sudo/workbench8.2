<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清理缓存</title><style>body{font-family:system-ui,sans-serif;background:#e8eaed;display:flex;align-items:center;justify-content:center;height:100dvh;margin:0;color:#1f2937}.box{text-align:center;background:#fff;padding:32px 48px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}h2{margin:0 0 8px;font-size:1.1rem}p{margin:0;color:#6b7280;font-size:.85rem}</style></head><body><div class="box"><h2>正在清理旧缓存...</h2><p>完成后将自动跳转到工作台</p></div><script>caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k)}))}).then(function(){return navigator.serviceWorker.getRegistrations()}).then(function(regs){return Promise.all(regs.map(function(r){return r.unregister()}))}).then(function(){location.replace("/?v=20260802")})</script></body></html>
